<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Abby 💖</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Stylish Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  background:
    linear-gradient(rgba(255,95,158,.75),rgba(255,134,179,.75)),
    url('https://images.unsplash.com/photo-1519681393784-d120267933ba');
  background-size:cover;
  background-position:center;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:#fff;
  transition: box-shadow 1s ease;
  font-family:'Montserrat', sans-serif;
}

body.glow{
  animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow{
  0%{box-shadow:0 0 30px rgba(255,47,109,0.3) inset;}
  50%{box-shadow:0 0 60px rgba(255,47,109,0.6) inset;}
  100%{box-shadow:0 0 80px rgba(255,47,109,0.4) inset;}
}

.container{
  background:rgba(255,255,255,.2);
  padding:40px;
  border-radius:25px;
  text-align:center;
  width:90%;
  max-width:420px;
  backdrop-filter:blur(6px);
  z-index:2;
}

h1{
  font-family:'Great Vibes', cursive;
  font-size:3rem;
  text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

p{
  margin:20px 0 30px;
  font-size:1.2rem;
}

.buttons{
  display:flex;
  justify-content:center;
  gap:20px;
}

button{
  padding:14px 30px;
  border:none;
  border-radius:30px;
  font-size:1rem;
  cursor:pointer;
  font-family:'Montserrat', sans-serif;
}

#yesBtn{
  background:#ff2f6d;
  color:#fff;
  box-shadow:0 6px 20px rgba(255,47,109,.6);
  transition: transform .2s ease;
}

#yesBtn:hover{transform:scale(1.1);}

#noBtn{
  background:#fff;
  color:#ff2f6d;
}

.message{
  display:none;
  margin-top:25px;
  animation:pop .6s ease forwards;
  font-family:'Great Vibes', cursive;
  font-size:1.6rem;
  text-shadow:1px 1px 4px rgba(0,0,0,0.3);
}

@keyframes pop{
  from{transform:scale(.6);opacity:0;}
  to{transform:scale(1);opacity:1;}
}

.signature{
  margin-top:25px;
  font-size:1rem;
  font-family:'Montserrat', sans-serif;
}

.effects{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:1;
}

/* Floating hearts/roses */
.symbol{
  position:absolute;
  opacity:0.9;
  animation:floatUp 4s linear forwards;
}

/* Sparkles */
.sparkle{
  position:absolute;
  color:#fff;
  opacity:0.8;
  font-size:8px;
  pointer-events:none;
  animation:sparkleUp 0.8s linear forwards;
}

@keyframes sparkleUp{
  0%{transform:translateY(0) scale(0.5);opacity:1;}
  100%{transform:translateY(-50px) scale(1.2);opacity:0;}
}

@keyframes floatUp{
  from{transform:translateY(100vh) scale(0.5);opacity:0;}
  20%{opacity:1;}
  to{transform:translateY(-120vh) scale(1.5);opacity:0;}
}

/* Balloons slower */
.balloon{
  position:absolute;
  opacity:0.85;
  animation:balloonUp 8s linear forwards;
}

@keyframes balloonUp{
  from{transform:translateY(100vh) scale(0.8);}
  to{transform:translateY(-120vh) scale(1.2);}
}
</style>
</head>

<body>

<audio id="bgMusic" loop>
  <source src="https://cdn.pixabay.com/audio/2023/02/14/audio_7c2e03e3e2.mp3">
</audio>

<div class="container">
  <h1>Abby 💖</h1>
  <p>Will you be my Valentine? 🌹✨</p>

  <div class="buttons">
    <button id="yesBtn">Yes 💘</button>
    <button id="noBtn">No 🙈</button>
  </div>

  <div class="message" id="loveMessage">
    <h2>Yaaay Abby!!! 😍❤️</h2>
    <p>
      You just made my heart explode 🥹💕<br>
      Thank you for being my Valentine 🌹<br>
      I can’t wait to love you more every day ❤️
    </p>
  </div>

  <div class="signature">💌 From: Elorm ❤️</div>
</div>

<div class="effects" id="effects"></div>

<script>
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
const message = document.getElementById('loveMessage');
const effects = document.getElementById('effects');
const body = document.body;
const music = document.getElementById('bgMusic');

/* NO BUTTON: untouchable */
function dodgeNo(e){
  e.preventDefault();
  e.stopPropagation();
  const x = (Math.random()*120)-60;
  const y = (Math.random()*80)-40;
  noBtn.style.transform = `translate(${x}px, ${y}px)`;
}
noBtn.addEventListener('mouseenter', dodgeNo);
noBtn.addEventListener('touchstart', dodgeNo);
noBtn.addEventListener('click', dodgeNo);

/* YES BUTTON: show message, start glow & music */
yesBtn.addEventListener('click', () => {
  message.style.display = 'block';
  music.play();
  body.classList.add('glow');
});

/* Continuous hearts + roses + sparkles */
function createSymbol(){
  const el = document.createElement('div');
  el.className='symbol';
  const r = Math.random();
  if(r<0.4) el.innerHTML='❤️';
  else el.innerHTML='🌹';
  el.style.left = Math.random()*100+'vw';
  el.style.fontSize = (Math.random()*28 + 22)+'px';
  effects.appendChild(el);

  // Sparkles for each symbol
  const sparkleCount = 3 + Math.floor(Math.random()*3);
  for(let i=0;i<sparkleCount;i++){
    const s = document.createElement('div');
    s.className='sparkle';
    s.innerHTML='✨';
    s.style.left = (el.offsetLeft + Math.random()*30 - 15)+'px';
    s.style.top = (window.innerHeight - 30)+'px';
    s.style.fontSize = (Math.random()*6 + 4)+'px';
    effects.appendChild(s);
    setTimeout(()=>s.remove(),800);
  }

  setTimeout(()=>el.remove(),4000);
}

/* Continuous balloons */
function createBalloon(){
  const el = document.createElement('div');
  el.className='balloon';
  el.innerHTML='🎈';
  el.style.left = Math.random()*100+'vw';
  el.style.fontSize = (Math.random()*32 + 24)+'px';
  effects.appendChild(el);
  setTimeout(()=>el.remove(),8000);
}

/* Run continuously */
setInterval(createSymbol, 150); // hearts + roses + sparkles
setInterval(createBalloon, 500); // balloons slower
</script>

</body>
</html>
